<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat Gemini</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
    <div class="container">
        <h1>Chat Gemini</h1>
        <!-- Login Form -->
        <div id="login-section">
            <h2>Iniciar sesión</h2>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button onclick="login()">Entrar</button>
            <div id="login-error" class="error"></div>
        </div>
        <!-- Chat Section (hidden until login) -->
        <div id="chat-section" style="display:none;">
            <div id="chat-history" class="chat-history"></div>
            <div class="input-row">
                <input type="text" id="message-input" placeholder="Escribe tu mensaje..." autocomplete="off">
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>
<script>
let token = null;

// Login function
async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const res = await fetch('/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (res.ok && data.access_token) {
        token = data.access_token;
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('chat-section').style.display = 'block';
        loadHistory();
    } else {
        document.getElementById('login-error').innerText = data.error || 'Error de autenticación';
    }
}

// Send message to chat
async function sendMessage() {
    const input = document.getElementById('message-input');
    const content = input.value.trim();
    if (!content) return;
    appendMessage('user', content);
    input.value = '';
    // Mostrar "Escribiendo..."
    appendMessage('assistant', 'Escribiendo...');
    const res = await fetch('/chat/send', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({content})
    });
    const data = await res.json();
    // Elimina "Escribiendo..."
    removeLastAssistantMessage();
    if (res.ok && data.response) {
        appendMessage('assistant', data.response);
    } else {
        appendMessage('assistant', data.error || 'Error al obtener respuesta');
    }
    scrollToBottom();
}

// Cargar historial
async function loadHistory() {
    const res = await fetch('/chat/history', {
        headers: {'Authorization': `Bearer ${token}`}
    });
    const data = await res.json();
    document.getElementById('chat-history').innerHTML = '';
    if (Array.isArray(data)) {
        data.forEach(msg => appendMessage(msg.role, msg.content));
    }
    scrollToBottom();
}

// Funciones auxiliares para el chat
function appendMessage(role, text) {
    const chat = document.getElementById('chat-history');
    const div = document.createElement('div');
    div.className = 'message ' + (role === 'user' ? 'user' : 'assistant');
    div.textContent = text;
    chat.appendChild(div);
}
function removeLastAssistantMessage() {
    const chat = document.getElementById('chat-history');
    const msgs = chat.getElementsByClassName('assistant');
    if (msgs.length) chat.removeChild(msgs[msgs.length - 1]);
}
function scrollToBottom() {
    const chat = document.getElementById('chat-history');
    chat.scrollTop = chat.scrollHeight;
}
document.getElementById('message-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
